apiVersion: orun.dev/v1
kind: Blueprint
metadata:
  name: tanstack-start
  description: >-
    The TanStack Start template as a Blueprint of itself — instantiate a new
    TanStack Start site repository (the welcome page, a todo list kept by
    server functions in each visitor's cookie, an API route and the three SSR
    modes, built by Cloudflare's Vite plugin onto Cloudflare Workers + Static
    Assets) and
    take it from nothing to live on stage and prod in two stages: the code,
    landed with GitHub alone (01-scaffold), then the site deployed and probed
    once Cloudflare is there (02-live), then the record. Run one at a time
    with `--phase <name>`, stop after the code with `--until 01-scaffold`, or
    run the whole sequence with `--resume`; see docs/phases/README.md for the
    contract every phase follows, and BOOTSTRAP.md for the operator checklist
    no script can perform.

# ── INPUTS ────────────────────────────────────────────────────────────────
# The instance-identity contract, consumed by tooling/rebrand/rebrand.mjs via
# the `.rebrand/values.json` the `rebrand-values` module templates. Every
# input a later phase needs is in that file, because it is committed and so
# survives a fresh container; `.orun/provenance.lock` does not.
#
# The card (blueprint.yaml) declares a subset of these with the patterns the
# console validates; testing/manifest.test.sh fails if a card input is not
# one of these, or if one of these is required and nothing supplies it.
inputs:
  reponame:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
    required: true
    description: Repo slug (e.g. acme-notes) — intent metadata.name, the Worker name prefix, the secret project.
  productname:
    type: string
    required: true
    description: The site's display name (e.g. "Acme Notes") — every page's title.
  productdomain:
    type: string
    default: ""
    description: >-
      The site's own domain, once it has one (e.g. acme.dev). NOT ASKED: the
      site answers on workers.dev from its first deploy, and a domain is an
      owner's step after it. Empty, the rebrand writes the reserved
      placeholder `<reponame>.example.com` where the domain goes (BASE_DOMAIN
      in intent.yaml, for dev, stage and prod), so setting it later is
      replacing that one string — the site's README, "Custom domain", says
      how. Pass it with --set only to brand a hand-run build with a domain it
      already has.
  githuborg:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9-]*$"
    required: true
    description: >-
      GitHub owner the site's repository is created under — and the owner in
      the source link the site's nav carries. The platform learns of a pull
      request only through the GitHub App installation on the account that
      owns the repository, so 01-scaffold's `link` hook stops before the
      landing unless the repository is linked to the workspace through it.
  subdomain:
    type: string
    default: "your-workers-subdomain"
    # LATE-BOUND (saas-orun-work WA5): it belongs to the Cloudflare account,
    # which a build that stops after 01-scaffold does not have yet. Such a
    # build runs without it — the default above is the placeholder the
    # scaffold brands into the tree — and the run that goes live supplies the
    # real value: orun's "a resumed run reuses what the product was built
    # with" rule exempts a late-bound input, so it may differ from what the
    # scaffold recorded. 02-live's `subdomain` hook binds it into the tree
    # and refuses the placeholder before anything deploys. An orun that
    # predates the flag ignores it (and a fresh container has no record to
    # differ from).
    lateBound: true
    description: >-
      The workers.dev subdomain of the Cloudflare account the site deploys
      into — its URLs, the smoke, the probes. A console or `--from bst_…`
      build gets it from the workspace's Cloudflare connection
      (blueprint.yaml declares `from: connection.cloudflare.workersSubdomain`);
      pass it with --set only for a hand-run build. Needed by 02-live, not
      before: a code-only build (`--until 01-scaffold`) leaves the
      placeholder, and 02-live binds the real value.
  repoPrivate:
    type: boolean
    default: true
    description: >-
      Whether the repository is created private. Private is the safe default;
      `orun.repo/ensure@v1` only sets it at creation — an existing repository
      keeps the visibility it has.
  orunWorkspace:
    type: string
    default: ""
    # Unset, it is the workspace the build runs in (ORUN_WORKSPACE — which a
    # console build's sandbox always sets, and which the console form cannot
    # send). A value set on the command line or recorded by the tree wins.
    from: workspace
    description: >-
      Orun Cloud workspace (ws_…) for the site's remote state. Unset, it is
      the workspace the build runs in; with none anywhere, 01-scaffold writes
      a placeholder that fails loudly rather than silently claiming another
      tenant's workspace.
  epicSlug:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
    default: tanstack-start-baselining
    description: >-
      The epic this bootstrap tracks itself under. Found by slug, so a run
      that starts fresh and a run that resumes find the same work.

# ── SOURCES ───────────────────────────────────────────────────────────────
# The baseline is this repository itself. Run `orun new` from its root so
# `path: .` resolves to it; orun pins it by digest into its object store
# before any module reads it, so an instance is reproducible and provenanced.
sources:
  - name: baseline
    kind: dir
    path: .

# Derived build output, local secrets, and the factory's own lanes — never
# carried into an instance.
#
# WHAT `ignore` ACTUALLY EXCLUDES: orun matches an entry two ways, and which
# one depends on the entry. A pattern with no glob metacharacter is compared
# against each path SEGMENT; only a pattern containing one is compared against
# the whole relative path. So `apps/web/.env.local` on its own would match
# nothing — it needs the `**/`. testing/coverage.test.sh refuses an entry that
# names a path without a glob.
ignore:
  - dist
  - coverage
  - .turbo
  - .tanstack
  - .wrangler
  - node_modules
  - .orun
  - plan.json
  - "**/*.tsbuildinfo"
  # `orun new` snapshots the WORKING TREE, not the git index: an operator's
  # local environment files would otherwise be copied into somebody else's
  # repository. `.env.example` is not among them, and ships.
  - "**/.env"
  - "**/.env.local"
  - "**/.env.*.local"
  - "**/.dev.vars"
  - "**/.dev.vars.*"
  # THE FACTORY'S OWN LANES. `github-workflows` copies the whole of `.github`,
  # so without these two entries every site built from this baseline would
  # carry them — `baseline.yml` runs `testing/*.sh`, which no module places,
  # and `tag.yml` cuts baseline tags a site does not have.
  # testing/coverage.test.sh fails if a lane reading `testing/` is not here.
  - "**/.github/workflows/baseline.yml"
  - "**/.github/workflows/tag.yml"

# ── MODULES ───────────────────────────────────────────────────────────────
# One module per component or root file. Root files are single-file modules
# rather than one module with an include list: a file shipping to a product
# is a line in a diff, and nothing of the factory (specs/, tasks/, testing/,
# hooks/, docs/phases/, tooling/rebrand/, tooling/bootstrap/, the blueprints,
# BOOTSTRAP.md) can ship by accident. testing/leak.test.sh holds that line.
modules:
  # ── the identity file every later phase reads back ───────────────────────
  # The only place blueprint inputs touch the tree; everything else is a
  # verbatim copy the `rebrand` hook rewrites. Committed, so a phase run months
  # later from a fresh container recovers what the operator answered.
  - name: rebrand-values
    mode: template
    files:
      ".rebrand/values.json": |
        {
          "reponame": "{{ .reponame }}",
          "productname": "{{ .productname }}",
          "productdomain": "{{ .productdomain }}",
          "subdomain": "{{ .subdomain }}",
          "orunWorkspace": "{{ .orunWorkspace }}",
          "githuborg": "{{ .githuborg }}",
          "epicSlug": "{{ .epicSlug }}"
        }

  # ── root files ───────────────────────────────────────────────────────────
  - name: root-intent
    mode: copy
    source: baseline
    from: intent.yaml
    to: intent.yaml
  - name: root-package-json
    mode: copy
    source: baseline
    from: package.json
    to: package.json
  - name: root-pnpm-workspace
    mode: copy
    source: baseline
    from: pnpm-workspace.yaml
    to: pnpm-workspace.yaml
  # The baseline's complete lockfile, as it is: the whole tree lands at once
  # and the lockfile carries no identity, so there is nothing to re-resolve —
  # the lanes install it with --frozen-lockfile, and the baseline's own CI
  # (testing/e2e.test.sh) does the same on this exact tree before a tag.
  - name: root-pnpm-lock
    mode: copy
    source: baseline
    from: pnpm-lock.yaml
    to: pnpm-lock.yaml
  - name: root-turbo
    mode: copy
    source: baseline
    from: turbo.json
    to: turbo.json
  - name: root-gitignore
    mode: copy
    source: baseline
    from: .gitignore
    to: .gitignore
  # The SITE's README, not this repository's: this one is about the baseline
  # (how to instantiate it, how it is tested), and a site's owner has no use
  # for any of that.
  - name: root-readme
    mode: copy
    source: baseline
    from: .baseline/product/README.md
    to: README.md
  - name: github-workflows
    mode: copy
    source: baseline
    from: .github
    to: .github
  - name: vscode
    mode: copy
    source: baseline
    from: .vscode
    to: .vscode

  # The two context pages a site genuinely owns: its operating contract, and
  # the deployment manifest 03-docs renders. One module per file, so a new
  # file in ai/context/ cannot ship without somebody writing a module for it.
  - name: ai-operations
    mode: copy
    source: baseline
    from: ai/context/operations.md
    to: ai/context/operations.md
  - name: ai-deployment
    mode: copy
    source: baseline
    from: ai/context/deployment.md
    to: ai/context/deployment.md

  # ── the empty discovery roots, declared ──────────────────────────────────
  # orun's repo-scale gate — and later `orun plan` in the site's own CI —
  # discovers apps/, infra/, packages/ and tests/, and a missing root is a
  # hard failure. The site fills apps/ in the same landing; the other three
  # stay empty (the site's test runs inside apps/web). A file the tree needs
  # in order to be valid is what a module is for.
  - name: discovery-roots
    mode: template
    files:
      "apps/.gitkeep": ""
      "infra/.gitkeep": ""
      "packages/.gitkeep": ""
      "tests/.gitkeep": ""

  # ── shared tooling ───────────────────────────────────────────────────────
  # The workspace's shared packages: the TypeScript and ESLint configuration
  # (both pnpm workspace projects, so the lockfile names them) and the
  # deploy-time wrangler renderer. The factory's tooling (rebrand, bootstrap)
  # stays here, and so does `tooling/migrations`: it checks the D1 migration
  # manifest of a `packages/db` this site does not have, and nothing a site
  # runs reads it.
  - name: tooling-tsconfig
    mode: copy
    source: baseline
    from: tooling/tsconfig
    to: tooling/tsconfig
  - name: tooling-eslint
    mode: copy
    source: baseline
    from: tooling/eslint
    to: tooling/eslint
  - name: tooling-wire
    mode: copy
    source: baseline
    from: tooling/wire
    to: tooling/wire

  # ── the site ─────────────────────────────────────────────────────────────
  # One component: the app carries its own tests (vitest over the site's
  # modules, beside the code they test, in apps/web), and there is no
  # separate test package to place.
  - name: web
    mode: copy
    source: baseline
    from: apps/web
    to: apps/web

# ── THE WORK, UP FRONT ────────────────────────────────────────────────────
# The bootstrap is work, so it lives where work lives — and all of it is on
# the plane before the first phase places a file: one epic, one milestone per
# phase in the order the phases run, one task per landing.
#
# `hooks.preInstantiate` (orun >= v2.60) runs under no phase, once per run, on
# a resume too. Everything here is find-or-create BY IDENTITY — the epic by
# slug, a milestone by name within its epic, a task by title within its epic —
# so a second run, a resume and a redo all find what the first run made. The
# milestones are created IN ORDER and BEFORE the tasks: the plane appends each
# new milestone after the last, and a task naming a milestone the epic does
# not have yet would create it out of order.
#
# A build that stops after 01-scaffold (a code-only app) opens all three
# milestones and tasks too: the plane then says what is left to do, and the
# build that goes live later finds them by the same identities.
#
# IN THE BACKGROUND (orun >= v2.88.0, `background: true` on every hook here).
# Nothing a phase does before its landing reads the task plane — the
# placement, the rebrand, the repository, the secrets — so the whole list runs
# beside 01-scaffold instead of before it, in order. A hook that works on the
# plane (`orun.task/ensure@v1`, `orun.pr/land@v1`) waits for it to finish; a
# failure here stops the build at the next hook.
#
# Each phase's own `task` hook runs `orun.task/ensure@v1` on its task again,
# just before its landing. Same identity, so it finds rather than creates,
# and it is how the phase gets the task's KEY for its landing; it sits in
# `post` rather than `pre` so that everything before it overlaps with this
# list. The MILESTONE keeps the phase's name: it is the identity the engine's
# phase events, the plane's evidence and the console's rows all meet on, and
# the card's `programme.milestones` names the same list.
hooks:
  preInstantiate:
    - id: epic
      uses: orun.task/ensure@v1
      background: true
      with:
        kind: epic
        slug: "{{ .inputs.epicSlug }}"
        name: "TanStack Start baselining — {{ .inputs.productname }}"
        description: >-
          Everything the TanStack Start template builds for
          {{ .inputs.productname }} in {{ .inputs.githuborg }}/{{ .inputs.reponame }}:
          the repository and the site's code in one landing, then the site
          live on stage and prod in a second, then the record of what went
          live. One milestone per phase, in the order the phases run; one task
          per landing, each bound to the pull request that lands it.
        owner: me
    - id: m01
      uses: orun.task/ensure@v1
      background: true
      with:
        kind: milestone
        epic: "{{ .inputs.epicSlug }}"
        name: 01-scaffold
        exitCriteria:
          - repository created under {{ .inputs.githuborg }} and linked to the workspace
          - the whole site on main, branded, its deploy lanes parked
          - CI on main green, deploying nothing
    - id: m02
      uses: orun.task/ensure@v1
      background: true
      with:
        kind: milestone
        epic: "{{ .inputs.epicSlug }}"
        name: 02-live
        exitCriteria:
          - the deploy credentials minted from the workspace's Cloudflare connection
          - the site built and deployed on stage and prod, its smoke green
          - the home page answers on both workers.dev URLs
    - id: m03
      uses: orun.task/ensure@v1
      background: true
      with:
        kind: milestone
        epic: "{{ .inputs.epicSlug }}"
        name: 03-docs
        exitCriteria:
          - ai/context/deployment.md on main matches the probed live URLs
          - prod waits on stage again
    - id: t01
      uses: orun.task/ensure@v1
      background: true
      with:
        kind: task
        epic: "{{ .inputs.epicSlug }}"
        milestone: 01-scaffold
        name: "Land the site's code"
        brief: >-
          Create {{ .inputs.githuborg }}/{{ .inputs.reponame }} and land the
          whole site as one pull request — intent, CI, tooling, the identity,
          the site and its tests, branded as {{ .inputs.productname }} — with
          its deploy lanes parked, so CI on main builds nothing it cannot
          deploy and deploys nothing. GitHub only: no provider is needed yet.
        prefix: BASE
        contract: .baseline/tasks/01-scaffold.TaskContract.yaml
    - id: t02
      uses: orun.task/ensure@v1
      background: true
      with:
        kind: task
        epic: "{{ .inputs.epicSlug }}"
        milestone: 02-live
        name: "Take the site live"
        brief: >-
          Bind the site to its Cloudflare account's workers.dev subdomain, mint
          the deploy credentials from the workspace's Cloudflare connection,
          put the deploy lanes back, and see the convergence build the site
          with Cloudflare's Vite plugin and deploy it to stage and prod,
          smoke-tested over HTTP.
        prefix: BASE
        contract: .baseline/tasks/02-live.TaskContract.yaml
    - id: t03
      uses: orun.task/ensure@v1
      background: true
      with:
        kind: task
        epic: "{{ .inputs.epicSlug }}"
        milestone: 03-docs
        name: "Record the live deployment"
        brief: >-
          Probe every live URL one last time and write the deployment record
          into the repository from what actually answered, not from what the
          blueprint intended.
        prefix: BASE
        contract: .baseline/tasks/03-docs.TaskContract.yaml

# ── PHASES ────────────────────────────────────────────────────────────────
# A phase is orun's own barrier over the module DAG and the whole of what a
# phase DOES: what it is for a person (`title`), what to budget
# (`expectedMinutes`), what must already be true (`requires`), and the hooks
# that do its work around placement — `pre` before, `post` after, `await` for
# what is still converging when the hooks are done.
#
# THE ORDER HERE IS THE EXECUTION ORDER, and the numbered names are the names
# the task plane's milestones carry. A dependency may never point forward
# across a phase boundary; orun refuses the blueprint if one does.
#
# TWO STAGES (saas-orun-work WA5; blueprint.yaml's `spec.stages`). The build
# splits where its needs change:
#
#   SCAFFOLD — 01-scaffold, GitHub only. The whole tree placed, branded and
#     landed as one pull request, the repository created and linked — with
#     the deploy lanes parked (tooling/bootstrap/deploys.mjs), so the merge's
#     CI on main plans dev's verify lane and nothing else: green, and nothing
#     deployed. An app with no Cloudflare connection stops here
#     (`--until 01-scaffold`, the platform's `until: scaffold`) and is CODE
#     ONLY: its repository, its CI and its pull requests' verify lanes all
#     work; nothing runs anywhere.
#   LIVE — 02-live, Cloudflare. The workers.dev subdomain bound (a late-bound
#     input), the deploy lanes put back, the deploy credentials minted, one
#     landing whose convergence deploys the site to stage and prod, watched
#     to green and probed. A build with a connection runs it straight after
#     the scaffold; a code-only app runs it later (`--resume`, which finds
#     01-scaffold placed and runs what follows).
#
# A FULL BUILD ENDS EXACTLY WHERE THE ONE-LANDING SHAPE DID (baseline-v1's
# 01-product): the same tree on main, live on stage and prod, recorded, its
# gates restored. It pays for one more landing — the scaffold's — and nothing
# else: the scaffold's merge deploys nothing, so no convergence is waited on
# twice, and the live landing's convergence is the one 01-product watched.
#
# Only 01-scaffold places modules: 02-live and 03-docs are hooks only. Each
# is a phase because it is a separately landable unit with its own task and
# its own PR. A hook-only phase derives as `unknown` (the
# tree cannot answer for a landing or a deployment), so `--resume` always
# runs it again — every hook in both is idempotent — and no phase may
# REQUIRE one: both require 01-scaffold, the phase whose files say it ran.
phases:
  - name: 01-scaffold
    title: The site's code, landed
    description: The whole tree — manifests, tooling, CI, the identity and the site — branded and landed as one pull request in a new repository, its deploy lanes parked, so CI on main is green and deploys nothing. Needs GitHub only.
    # An estimate, not a measurement: the placement and the rebrand, the
    # repository created and linked, the task found, the commit checked here
    # and merged. Nothing is built or waited on: the merge's CI plans a verify
    # lane and deploys nothing, and nothing watches it.
    expectedMinutes: 1
    narrate:
      start:  "Creating the repository and landing the whole site in one pull request — intent, CI, tooling, the welcome page, the server-function todos, the API route and the SSR demos — with its deploy lanes parked until the site has somewhere to deploy to. Usually about {{ .meta.expectedMinutes }} minute."
      done:   "{{ .inputs.reponame }}'s code is on main — {{ .meta.files }} files, branded as {{ .inputs.productname }}. Its CI checks every change and deploys nothing yet. That took {{ .meta.elapsed }}."
      failed: "The site's code did not land. The step above names what stopped it — the rebrand, the repository, its link to the workspace, or the landing's own check — and nothing was merged."
    modules: [ai-deployment, ai-operations, discovery-roots, github-workflows, rebrand-values, root-gitignore, root-intent, root-package-json, root-pnpm-lock, root-pnpm-workspace, root-readme, root-turbo, tooling-eslint, tooling-tsconfig, tooling-wire, vscode, web]
    # GITHUB ONLY, AND NOT AS A CONNECTION ROW. The platform learns of a pull
    # request only through the GitHub App installation on the account that
    # OWNS the repository, and the proof of that is the repository's link to
    # the workspace — which `link` below checks before anything lands. There
    # is no `requires.probe` for GitHub: a connection probe reads the
    # workspace's own connection list, and a repository orun.work keeps in its
    # managed GitHub org is linked through a platform connection that list
    # never shows, so the probe would wait out its ten minutes on a build that
    # is ready. Cloudflare is 02-live's to ask for.
    hooks:
      post:
        # The identity chain. rebrand.mjs enumerates the tree with
        # `git ls-files`, so the output has to be a git repository with a
        # populated index BEFORE it runs. `git add -A` only stages; the landing
        # commits. The whole tree is here, so the one rebrand brands all of it.
        - id: git-init
          run: ["git", "init", "-q"]
        - id: git-stage
          run: ["git", "add", "-A"]
        - id: rebrand
          run: ["node", "{{ .baseline.dir }}/tooling/rebrand/rebrand.mjs", "--values", ".rebrand/values.json", "--allow-dirty"]
        # Re-tenant the site. rebrand.mjs treats the orun state backend as
        # org-owned and leaves it alone, so intent.yaml would keep THIS
        # repository's `workspace:` — the site's CI would then claim another
        # tenant's workspace on every remote op. The value travels through
        # .rebrand/values.json, which the identity chain already reads.
        - id: orun-workspace
          run:
            - node
            - -e
            - |
              const fs = require("fs");
              const values = JSON.parse(fs.readFileSync(".rebrand/values.json", "utf8"));
              const ws = String(values.orunWorkspace || "").trim() || "ws_SET_ME";
              const before = fs.readFileSync("intent.yaml", "utf8");
              // Look for the line rather than for a change: a site built into
              // a workspace already named there rewrites the line to the value
              // it already has, and "unchanged" is not "missing".
              const line = /^(\s*workspace:\s*).*$/m;
              if (!line.test(before)) {
                console.error("orun-workspace: no `workspace:` line in intent.yaml — refusing to guess");
                process.exit(1);
              }
              fs.writeFileSync("intent.yaml", before.replace(line, "$1" + ws));
              console.log(
                ws === "ws_SET_ME"
                  ? "orun-workspace: wrote placeholder ws_SET_ME — set your Orun Cloud workspace before enabling remote state"
                  : "orun-workspace: intent.yaml workspace -> " + ws,
              );
        # The site carries no work tree of this repository's: `specs/` and
        # `tasks/` never ship, so intent.yaml's `work:` block would point its
        # every plan at two directories that do not exist.
        - id: work-tree
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/work-tree.mjs", "--strip"]
        # THE DEPLOY LANES ARE PARKED UNTIL THE SITE GOES LIVE. Stage and prod
        # deploy on every merge to main; until 02-live has minted the deploy
        # credentials there is nothing to deploy with, and a code-only app
        # would go red on every merge. So their push-to-main activation is
        # deferred here and restored by 02-live; dev keeps its own, so a merge
        # still plans (orun refuses a push plan no environment answers) and
        # runs dev's verify lane — the site built and dry-deployed, no
        # credential. Pull requests keep every verify lane.
        # tooling/bootstrap/deploys.mjs.
        - id: deploys
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/deploys.mjs", "--defer"]
        # Re-stage so `git ls-files` and `rebrand --verify` see the rewritten tree.
        - id: git-restage
          run: ["git", "add", "-A"]
        - id: rebrand-verify
          run: ["node", "{{ .baseline.dir }}/tooling/rebrand/rebrand.mjs", "--verify", "--values", ".rebrand/values.json"]
        # The repo has to exist before there is anywhere to land.
        - id: repo
          uses: orun.repo/ensure@v1
          narrate: "The repository exists at {{ .inputs.githuborg }}/{{ .inputs.reponame }}."
          with:
            owner: "{{ .inputs.githuborg }}"
            name: "{{ .inputs.reponame }}"
            private: "{{ .inputs.repoPrivate }}"
        # THE REPOSITORY MUST BE THE WORKSPACE'S before anything lands in it,
        # or the platform never sees its pull requests and the site's own CI
        # cannot reach the platform: every lane authenticates over GitHub
        # OIDC, resolved through the repo link. `link` may be refused where the
        # credential cannot write links (a workspace key) and the platform has
        # linked the repository already, so it is best effort and `check` is
        # the gate — an unlinked repository stops here, naming the fix,
        # instead of in every lane.
        - id: link
          run:
            - bash
            - -c
            - |
              orun cloud link --org "$1" || true
              orun cloud check --org "$1" || {
                echo "$2 is not linked to workspace $1 — its CI cannot authenticate. Link it (orun cloud link --org $1, or the console's Git Repos) and re-run this phase." >&2
                exit 1
              }
            - link
            - "{{ .inputs.orunWorkspace }}"
            - "{{ .inputs.githuborg }}/{{ .inputs.reponame }}"
        # The task this landing closes, and its key. The run-level list above
        # opens it in the background; this is the first hook that needs it,
        # so it is the one that waits for that list (orun >= v2.88.0) — every
        # hook before it ran while the task plane was still being set up.
        - id: task
          uses: orun.task/ensure@v1
          with:
            kind: task
            epic: "{{ .inputs.epicSlug }}"
            milestone: "{{ .phase.name }}"
            name: "Land the site's code"
            prefix: BASE
            contract: .baseline/tasks/01-scaffold.TaskContract.yaml
        # THE SITE IS A PULL REQUEST THAT IS CHECKED, THEN MERGED — checked
        # HERE (`checks: local`, orun >= v2.88.0): `orun validate`, then
        # `orun plan` as the pull request and as the merge to main plan it,
        # on the commit, before it is pushed. That is what the PR's `plan`
        # job checks (the intent, every component and every composition
        # resolve), plus the merge's own plan, in under a second instead of a
        # runner's ~25 s. A tree that fails is never pushed. The PR's CI still
        # runs (`plan` alone on a bootstrap branch, `orun/BASE-…`, ci.yml);
        # nothing waits for it. The merge's run on main plans dev's verify
        # lane and deploys nothing, so there is no convergence to await: the
        # phase is done when the code is on main.
        - id: land
          uses: orun.pr/land@v1
          narrate: "The site's code is merged into main."
          with:
            task: "{{ .phase.hooks.task.outputs.key }}"
            epic: "{{ .inputs.epicSlug }}"
            branchSlug: "{{ .phase.name }}"
            title: "feat: {{ .inputs.productname }}, the whole site from the TanStack Start template"
            checks: local

  # Places nothing: it takes what 01-scaffold landed live. Its needs are the
  # card's `requires.integrations` beyond GitHub — Cloudflare — so this is
  # the first phase that asks for it.
  - name: 02-live
    title: The site, live on stage and prod
    description: The site bound to its Cloudflare account's workers.dev subdomain, its deploy credentials minted, its deploy lanes put back, and one landing whose convergence deploys it to stage and prod, watched and probed.
    # An estimate, not a measurement of this shape: what baseline-v1's
    # 01-product took for its landing and convergence, less the placement now
    # in 01-scaffold — the merge's convergence is the site's Vite build,
    # deploy and smoke, stage and prod side by side, watched every 5 s.
    expectedMinutes: 3
    narrate:
      start:  "Taking the site live: minting its deploy credentials from the Cloudflare connection and landing one pull request whose convergence builds the site with Cloudflare's Vite plugin and deploys it to stage and prod side by side. Usually about {{ .meta.expectedMinutes }} minutes."
      await:  "The site is building and deploying on both environments. A first deploy waits on its workers.dev route; nothing is stuck."
      done:   "{{ .inputs.reponame }} is live on stage and prod at {{ .inputs.subdomain }}.workers.dev. That took {{ .meta.elapsed }}."
      failed: "The site did not come up. The failing step above names what stopped it — the subdomain, the credentials, or the convergence's build, deploy or smoke — and a provider error is in its log."
    modules: []
    # The code must be on main, and Cloudflare connected. `requires.probe`
    # asks reality what a lock file cannot: is the connection live right now?
    # Asked once before the run's first phase and, if it is not, again just
    # before this one, waiting up to ten minutes for a consent — so a build
    # that has no connection yet still lands its code first.
    requires:
      phases: [01-scaffold]
      probe:
        - id: providers
          uses: orun.doctor/check@v1
          with:
            providers: [cloudflare]
            waitSeconds: 600
            pollSeconds: 20
    hooks:
      post:
        # THE LATE-BOUND INPUT, BOUND. A code-only app's tree carries the
        # placeholder subdomain; the run that goes live knows the account's
        # real one and writes it where the placeholder stands — the
        # component's smoke URL, intent.yaml's environment URLs, the operating
        # contract, `.rebrand/values.json`. Refuses the placeholder itself:
        # every URL below is built from it. A build that ran both stages at
        # once already carries the real value, and this changes nothing.
        # tooling/bootstrap/subdomain.mjs.
        - id: subdomain
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/subdomain.mjs", "--bind", "{{ .inputs.subdomain }}"]
        # The deploy lanes 01-scaffold parked: stage and prod deploy on a
        # merge to main again, starting with this landing's.
        - id: deploys
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/deploys.mjs", "--restore"]
        # STAGE AND PROD DEPLOY SIDE BY SIDE UNTIL THE BOOTSTRAP IS DONE. The
        # promotion gate makes prod wait out stage's deploy; during a
        # bootstrap both are empty and the landing is watched to green, so it
        # protects nothing and doubles the convergence. Deferred here,
        # restored by 03-docs. tooling/bootstrap/promotion.mjs.
        - id: promotion
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/promotion.mjs", "--defer"]
        # DEV'S VERIFY LANES STAY OFF MAIN UNTIL THE BOOTSTRAP IS DONE, by the
        # same mechanism: a third TanStack Start build beside the two deploys
        # proves nothing the baseline's own CI did not, and competes with them
        # for runners. Pull requests keep their dev lanes; 03-docs restores
        # the push activation. tooling/bootstrap/dev-lanes.mjs.
        - id: dev-lanes
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/dev-lanes.mjs", "--defer"]
        # THIS LANDING MUST DEPLOY THE SITE, and a re-run must too. Restoring
        # the lanes changes only intent.yaml's `environments`, which `orun
        # plan --changed` maps to no component — and after a convergence
        # that failed AFTER its PR merged, a forced re-run would land an
        # EMPTY diff. So the phase rewrites ONE trailing marker line in each
        # component.yaml its contract names — `# orun: redeploy <phase>
        # <stamp>` — and the landing's merge plans those components on stage
        # and prod. The marker is a deploy trigger, not state: nothing reads
        # it back.
        - id: retouch
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/retouch.mjs", "--phase", "{{ .phase.name }}", "--affects", "{{ .baseline.dir }}/.baseline/tasks/02-live.TaskContract.yaml"]
        # The deploy credentials, brokered, in ONE hook (orun >= v2.87.0):
        # `secrets` mints each key under its own scope template from the one
        # connection the build is bound to, reading the connections and the
        # existing secrets once and creating the missing keys side by side.
        # `workers-deploy` is the site's deploy (Workers Scripts); the account
        # id is a connection fact. The deploy lane binds both keys (the
        # workers-assets composition's `secretBindings`). Keys that already
        # exist are kept. Before the landing whose convergence uses them.
        - id: secrets
          uses: orun.integrations/reconcile@v1
          with:
            provider: cloudflare
            secrets:
              - { key: CLOUDFLARE_API_TOKEN, template: workers-deploy }
              - { key: CLOUDFLARE_ACCOUNT_ID, template: account-id }
        - id: task
          uses: orun.task/ensure@v1
          with:
            kind: task
            epic: "{{ .inputs.epicSlug }}"
            milestone: "{{ .phase.name }}"
            name: "Take the site live"
            prefix: BASE
            contract: .baseline/tasks/02-live.TaskContract.yaml
        # Checked here and merged, as 01-scaffold's landing is. The merge runs
        # the site's build, deploy and smoke on main moments later, for real,
        # and that convergence is what `await` watches to green.
        - id: land
          uses: orun.pr/land@v1
          narrate: "The site's deploy is merged into main."
          with:
            task: "{{ .phase.hooks.task.outputs.key }}"
            epic: "{{ .inputs.epicSlug }}"
            branchSlug: "{{ .phase.name }}"
            title: "feat: {{ .inputs.productname }}, live on stage and prod"
            checks: local
      await:
        - id: converge
          uses: orun.run/watch@v1
          narrate: "The site built, deployed and passed its smoke, and the convergence run came back green."
          with:
            # The run for the commit THIS landing merged — the branch's newest
            # run, read the moment the merge returns, may be another push's
            # (01-scaffold's merge, moments earlier, has a run of its own).
            sha: "{{ .phase.hooks.land.outputs.mergeSha }}"
            repo: "{{ .inputs.githuborg }}/{{ .inputs.reponame }}"
            resumeBudget: 3
            waitSeconds: 1800
            # Read every 5 s, not the action's 40: the build goes on the
            # moment the run is green instead of up to 40 s after it.
            pollSeconds: 5
        - id: verify
          uses: orun.http/probe@v1
          narrate: "The site answered on stage and prod."
          with:
            urls:
              - "https://{{ .inputs.reponame }}-web-stage.{{ .inputs.subdomain }}.workers.dev"
              - "https://{{ .inputs.reponame }}-web-prod.{{ .inputs.subdomain }}.workers.dev"

  # Places nothing. It records what 02-live deployed, from PROBED facts
  # rather than from what the blueprint intended — which is why it runs last.
  # Its render probes every URL as it writes the record, and this landing
  # redeploys nothing, so there is no probe after it to wait for.
  - name: 03-docs
    title: The deployment, recorded
    description: The live-deployment manifest, rendered from probed reality, and the promotion gate put back.
    # An estimate, not a measurement: the render's probes, the task found,
    # the commit checked here and merged — nothing built, nothing waited on.
    expectedMinutes: 1
    narrate:
      start:  "Now recording what was actually built — probing every URL and writing the deployment manifest into the repository."
      done:   "ai/context/deployment.md now records the live deployment, written from probed facts, and prod waits on stage again. {{ .meta.elapsed }}."
      failed: "The deployment record did not land. The site is still live; only the write-up is missing."
    modules: []
    # 01-scaffold, not 02-live: a hook-only phase derives as `unknown`, and a
    # requirement on one fails closed. `--resume` runs 02-live before this.
    requires:
      phases: [01-scaffold]
    hooks:
      post:
        # THE SITE GOES LIVE WITH ITS PROMOTION GATE. 02-live deferred
        # `prod.promotion.dependsOn: [stage]`; this, the last landing, puts it
        # back, and from here on a change reaches prod only after stage.
        # Restoring touches only intent.yaml's `environments` section, which
        # `orun plan --changed` maps to no component, so this landing
        # redeploys nothing.
        - id: promotion
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/promotion.mjs", "--restore"]
        # And dev verifies every merge to main again (02-live deferred it).
        - id: dev-lanes
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/dev-lanes.mjs", "--restore"]
        - id: render
          run: ["bash", "{{ .baseline.dir }}/hooks/render-deployment-docs.sh", ".", "{{ .inputs.orunWorkspace }}", "{{ .baseline.dir }}"]
        - id: task
          uses: orun.task/ensure@v1
          with:
            kind: task
            epic: "{{ .inputs.epicSlug }}"
            milestone: "{{ .phase.name }}"
            name: "Record the live deployment"
            prefix: BASE
            contract: .baseline/tasks/03-docs.TaskContract.yaml
        # Checked here and merged, as the other landings are; nothing here
        # builds.
        - id: land
          uses: orun.pr/land@v1
          narrate: "The deployment record is merged into main."
          with:
            task: "{{ .phase.hooks.task.outputs.key }}"
            epic: "{{ .inputs.epicSlug }}"
            branchSlug: "{{ .phase.name }}"
            title: "docs(deployment): record the live deployment state"
            checks: local
